[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-rate-limiter"
version = "0.1.0"
description = "Thread-safe sliding-window and token-bucket rate limiter for LLM API gateways, in-memory or Redis-backed"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Aryan Sharma" }]
dependencies = []

[project.optional-dependencies]
redis = ["redis>=4.0"]

[tool.setuptools]
packages = ["ratelimiter"]
