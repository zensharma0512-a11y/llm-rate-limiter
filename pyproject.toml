[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ratekeeper"
version = "0.1.0"
description = "Per-tenant request quotas for AI model APIs: sliding-window and token-bucket throttling, in-process or across a fleet via Redis"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Aryan Sharma" }]
dependencies = []

[project.optional-dependencies]
redis = ["redis>=4.0"]

[tool.setuptools]
packages = ["ratekeeper"]
